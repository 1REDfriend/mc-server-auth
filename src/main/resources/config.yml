# Failed password attempts allowed per connection before the player is disconnected (1-20).
max-attempts-per-connection: 3
ip-ban:
  failures: 5          # failures from one IP ...
  window-minutes: 10   # ... within this window
  ban-minutes: 10      # result in a temporary ban
login-timeout-seconds: 60
# How long a dialog that waits for an emailed code stays open.
code-wait-timeout-minutes: 10
password:
  min-length: 6
  max-length: 64
# Skips BOTH passwords on a reconnect of the same name from the same IP within the window. Anyone else on that
# IP (shared Wi-Fi, NAT) can then join as that name. Changing the server password clears all remembered logins.
session-remember:
  enabled: false       # skip dialogs on reconnect from the same IP
  minutes: 5
# Debugging aid. Records everything players type into this plugin's dialogs, PASSWORDS INCLUDED, exactly as their
# client sent it, to plugins/McServerAuth/secret-input-logs/ (one file per UTC day). Values are base64-encoded, which
# is NOT encryption: anyone who can read these files can read every player's real password, and players often reuse
# passwords elsewhere. Turn it on only while hunting a bug, then turn it off and delete the files.
secret-input-log:
  enabled: false
  keep-days: 7         # files older than this are deleted automatically
email:
  max-accounts-per-email: 3
  code-valid-minutes: 15
  code-max-attempts: 5 # wrong codes (from the IP that asked for it) before a code is burned; 1-10
  smtp:
    host: ""           # e.g. smtp.gmail.com; blank = no email: players register without one, admins reset passwords
    port: 587
    security: starttls # starttls | ssl | none (none only for a local test mail server)
    username: ""
    password: ""       # app password; never commit a real one
    from: ""           # e.g. "My Server <noreply@example.com>"
